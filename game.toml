[recompiler]
seeds = "seeds/ghidra_funcs.txt"
out_dir = "generated"
strict = true

[runtime]
window_title = "Gran Turismo 2 (USA) (Simulation Mode) (v1.2) Recompiled"
memcard_dir = "saves"

[video]
renderer = "opengl"
# Resolution / clarity upgrades (verified under GL; supersampling applies on
# real GPUs — llvmpipe clamps to 1x, see docs/ENHANCEMENTS.md).
supersampling = 2
antialiasing = true
texture_filtering = "bilinear"
geometry_correction = false
perspective_texturing = false
aspect_ratio = "16:9"

[widescreen]
# GTE-activity gameplay detector: GT2's 3D frames project hundreds of verts
# through RTPS/RTPT, menus project ~none. Sticky 45-frame hysteresis kills
# the wide/4:3 side-margin flicker from the 2-frame sprite-tag window.
gte_game_mode = true
# Squash path (not native-wide): native-wide mirrors every prim into a
# second wide FBO — at 4x internal that's the slowdown + barely-rendering.
# Squash keeps one draw pass; sprite tags + hud squash stay active.
native_wide = false
# Scratchpad addr holding the prim's GTE-projected SXY at tag time. Same
# Tomba convention — UNVERIFIED for GT2 (see docs/WIDESCREEN_RE.md §"Anchor
# semantics UNVERIFIED"). Wire only after runtime confirmation that 0x1F800070
# holds an SXY value (not a pointer) when tag funcs execute.
sprite_anchor_addr = "0x1F800070"
# Center/edge-squash untagged SPRTs (screen-space HUD/menus). Runtime-only.
hud_sprt_squash = true

[audio]
# Catmull-Rom SPU resample; cheap, strictly better than stock.
spu_hq = true

[controller]
default_mode = "digital"

# Online mount gate: digests + track count + optional TOC fingerprint
# (see docs/NETPLAY.md).
[netplay]
require_cue = true
required_tracks = 1
required_disc_fp = "7f985aa6865ae752828a4eb0b6cddc9cb1e243ed61f40f2be64e7af91d553dc4"

# Patches applied for main menu:
# - headless auto-input + VRAM dump via tools/patches/psxrecomp-gt2-headless.patch
#   (SIO-level START/CROSS/d-pad phases to garage + race drive; see docs/HEADLESS_INPUT_PATCH.md)
# - windowed tests need PSX_LOW_LATENCY_INPUT=0 (runtime re-sample stomps slot 0)
# - background tests need SDL_AUDIODRIVER=dummy (windowed runs open host audio)
# - disc staging fix: ensure 660M bin is symlinked to build/disc (cmake POST_BUILD should copy bin)
# - overlay floor 0xA9000 derived from load_address 0x80010000 + text_size 0x99000, verified via dirty_ram_is_dirty for 0x80165000
# No game.toml [[patch]] needed for memory; overlay handled via interpreter, GTFS via ISOReader.

